<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataAgent · SSE</title>
    <style>
      :root {
        --bg: #f4f6f2;
        --ink: #1c241c;
        --muted: #5d6b5d;
        --card: #ffffff;
        --line: #d7e0d5;
        --accent: #1f6b4a;
        --tool: #eef6f1;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        background:
          radial-gradient(circle at top left, #e7f0e6, transparent 40%),
          linear-gradient(180deg, #f7faf6, var(--bg));
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }
      header, footer, main { width: min(860px, 100%); margin: 0 auto; padding: 1rem 1.25rem; }
      header {
        display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
      }
      h1 { font-size: 1.4rem; margin: 0; letter-spacing: 0.02em; }
      #status { color: var(--muted); font-size: 0.95rem; }
      #chat {
        display: flex; flex-direction: column; gap: 0.85rem;
        overflow-y: auto; padding-bottom: 1rem; min-height: 0;
      }
      .bubble, .tool, .hint {
        background: var(--card); border: 1px solid var(--line); border-radius: 14px;
        padding: 0.9rem 1rem; line-height: 1.55; white-space: pre-wrap;
      }
      .user { align-self: end; background: #e8f3ec; max-width: 80%; }
      .ai { align-self: start; max-width: 90%; }
      .tool { align-self: start; background: var(--tool); max-width: 90%; font-family: ui-monospace, monospace; font-size: 0.85rem; }
      .hint { color: var(--muted); }
      .err { color: #9b1c1c; }
      form {
        display: grid; grid-template-columns: 1fr auto auto; gap: 0.6rem;
        padding: 1rem 1.25rem 1.4rem; width: min(860px, 100%); margin: 0 auto;
      }
      textarea {
        resize: none; min-height: 52px; border-radius: 12px; border: 1px solid var(--line);
        padding: 0.8rem 0.9rem; font: inherit; background: var(--card);
      }
      button {
        border: 0; border-radius: 12px; padding: 0 1rem; font: inherit; cursor: pointer;
        background: var(--accent); color: white;
      }
      button.secondary { background: #5d6b5d; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <header>
      <h1>DataAgent</h1>
      <div id="status">就緒</div>
    </header>
    <main id="chat">
      <div class="hint" id="hint">試試：「華東地區筆記本賣了多少？」或「對比華東和華南總銷售額」</div>
    </main>
    <form id="form">
      <textarea id="msg" placeholder="輸入問題…" rows="2"></textarea>
      <button id="send" type="submit">發送</button>
      <button id="stop" class="secondary" type="button" hidden>停止</button>
    </form>
    <script>
      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      const send = document.getElementById("send");
      const stop = document.getElementById("stop");
      const status = document.getElementById("status");
      const hint = document.getElementById("hint");

      let busy = false;
      let bubble = null;
      let controller = null;

      function setBusy(v) {
        busy = v;
        send.hidden = v;
        stop.hidden = !v;
        msg.disabled = v;
        status.textContent = v ? "思考中…" : "就緒";
        if (!v) msg.focus();
      }

      function ensureBubble() {
        if (!bubble || bubble.dataset.done) {
          if (hint) hint.remove();
          bubble = document.createElement("div");
          bubble.className = "bubble ai";
          chat.appendChild(bubble);
        }
      }

      function handle(type, data) {
        if (type === "text") {
          ensureBubble();
          bubble.textContent += data.delta;
          chat.scrollTop = chat.scrollHeight;
        } else if (type === "tool_start") {
          const card = document.createElement("div");
          card.className = "tool";
          card.id = "tool-" + data.id;
          card.textContent = `🔧 ${data.name}\n${JSON.stringify(data.args)}\n執行中…`;
          chat.appendChild(card);
          chat.scrollTop = chat.scrollHeight;
        } else if (type === "tool_end") {
          const card = document.getElementById("tool-" + data.id);
          if (card) {
            card.textContent =
              `🔧 ${data.name}\n` +
              (data.isError ? "❌ " : "✅ ") +
              (data.result || "(empty)");
          }
        } else if (type === "done") {
          if (bubble) bubble.dataset.done = "1";
          setBusy(false);
        } else if (type === "error") {
          const el = document.createElement("div");
          el.className = "bubble ai err";
          el.textContent = "出錯：" + data.message;
          chat.appendChild(el);
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = msg.value.trim();
        if (!message || busy) return;
        setBusy(true);

        const user = document.createElement("div");
        user.className = "bubble user";
        user.textContent = message;
        chat.appendChild(user);
        msg.value = "";
        bubble = null;

        controller = new AbortController();
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message }),
            signal: controller.signal,
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || `HTTP ${res.status}`);
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = buf.indexOf("\n\n")) >= 0) {
              const raw = buf.slice(0, idx);
              buf = buf.slice(idx + 2);
              const line = raw.split("\n").find((l) => l.startsWith("data: "));
              if (!line) continue;
              const parsed = JSON.parse(line.slice(6));
              handle(parsed.type, parsed.data);
            }
          }
        } catch (err) {
          if (err.name !== "AbortError") {
            const el = document.createElement("div");
            el.className = "bubble ai err";
            el.textContent = "請求失敗：" + err.message;
            chat.appendChild(el);
          }
          setBusy(false);
        } finally {
          controller = null;
        }
      });

      stop.addEventListener("click", () => {
        if (controller) controller.abort();
      });
      msg.focus();
    </script>
  </body>
</html>
